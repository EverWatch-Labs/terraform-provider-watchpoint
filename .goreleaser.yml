# GoReleaser configuration for a Terraform provider, following HashiCorp's
# terraform-provider-scaffolding-framework template. Produces the archives,
# manifest, checksums and detached signature the Terraform Registry requires,
# and publishes the GitHub Release for the current git tag.
#
# Run locally (with the same env the pipeline sets):
#   GPG_FINGERPRINT=<fpr> GPG_PASSPHRASE=<pass> GITHUB_TOKEN=<tok> \
#     goreleaser release --clean
version: 2

project_name: terraform-provider-watchpoint

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - '-s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }}'
    goos:
      - darwin
      - freebsd
      - linux
      - windows
    goarch:
      - amd64
      - '386'
      - arm
      - arm64
    ignore:
      # Terraform does not ship a darwin/386 build.
      - goos: darwin
        goarch: '386'
    binary: '{{ .ProjectName }}_v{{ .Version }}'

archives:
  - formats:
      - zip
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256

signs:
  - artifacts: checksum
    # GoReleaser cannot drive an interactive passphrase prompt, so pass it to
    # gpg in loopback mode. GPG_FINGERPRINT / GPG_PASSPHRASE are exported by the
    # pipeline; the detached, binary .sig (no --armor) is what the registry wants.
    args:
      - '--batch'
      - '--local-user'
      - '{{ .Env.GPG_FINGERPRINT }}'
      - '--pinentry-mode'
      - 'loopback'
      - '--passphrase'
      - '{{ .Env.GPG_PASSPHRASE }}'
      - '--output'
      - '${signature}'
      - '--detach-sign'
      - '${artifact}'

release:
  extra_files:
    - glob: 'terraform-registry-manifest.json'
      name_template: '{{ .ProjectName }}_{{ .Version }}_manifest.json'

changelog:
  disable: true
